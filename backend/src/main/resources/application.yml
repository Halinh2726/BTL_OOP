# Cấu hình chung. Mọi giá trị nhạy cảm lấy từ biến môi trường hoặc file .env cục bộ,
# giá trị sau dấu ':' chỉ là mặc định cho máy dev.
spring:
  application:
    name: parking-backend
  config:
    # Tự động nạp file .env ở thư mục gốc dự án (nếu có); biến môi trường hệ thống vẫn ưu tiên cao hơn.
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # connectionTimeZone=UTC: mọi thời điểm lưu xuống CSDL theo UTC, đổi sang giờ VN ở tầng ứng dụng
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:parking}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:parking}
    password: ${DB_PASSWORD:parking}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000} # Docker dùng 10s để đủ thời gian cho lần khởi động lạnh
            # Chờ khóa dòng (ví đang bị giao dịch khác khóa) tối đa 5 giây thay vì 50 giây mặc định của InnoDB
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 5
  jpa: 
    open-in-view: false            # không giữ kết nối CSDL suốt request; transaction do use case quyết định
    hibernate:
      ddl-auto: validate           # schema do Flyway quản lý; Hibernate chỉ KIỂM TRA, không tự sửa bảng
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"   # mỗi dòng log kèm traceId của request (TraceIdFilter)

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never      # không bao giờ trả stack trace cho client
  servlet:
    session:
      timeout: 30m                 # Đặc tả API mục 3: hết hạn sau 30 phút không hoạt động
      cookie:
        name: SESSION
        http-only: true            # JavaScript không đọc được cookie phiên
        same-site: strict
        secure: ${COOKIE_SECURE:false}
# Cấu hình nghiệp vụ của ứng dụng
parking:
  zone-id: Asia/Ho_Chi_Minh        # R03: giờ tính phí là giờ Việt Nam theo đồng hồ máy chủ
  mail:
    from: ${PARKING_MAIL_FROM:no-reply@parking.ptit.edu.vn}
    alert-to: ${PARKING_MAIL_ALERT_TO:}
  vietqr:
    bank-id: ${VIETQR_BANK_ID:MB}
    account-no: ${VIETQR_ACCOUNT_NO:0987654321}
    account-name: ${VIETQR_ACCOUNT_NAME:BAI XE HOC VIEN PTIT}
    template: ${VIETQR_TEMPLATE:compact2}
  webhook:
    api-key: ${WEBHOOK_API_KEY:sepay_secret_key_123456}
