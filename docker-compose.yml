services:
  mysql:
    image: mysql:8.4
    container_name: parking-mysql
    command:
      - --character-set-server=utf8mb4          # lưu đúng tiếng Việt
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00              # CSDL lưu UTC, ứng dụng đổi sang giờ Việt Nam
      - --log-bin-trust-function-creators=1     # cho phép user thường tạo trigger (R10) khi bật binlog
    environment:
      MYSQL_DATABASE: ${DB_NAME:-parking}
      MYSQL_USER: ${DB_USERNAME:-parking}
      MYSQL_PASSWORD: ${DB_PASSWORD:-parking}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: parking-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-parking}
      DB_USERNAME: ${DB_USERNAME:-parking}
      DB_PASSWORD: ${DB_PASSWORD:-parking}
      SERVER_PORT: 8080
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-10000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OAUTH_PUBLIC_ORIGIN: ${OAUTH_PUBLIC_ORIGIN:-http://localhost:5173}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      PARKING_MAIL_FROM: ${PARKING_MAIL_FROM:-no-reply@parking.ptit.edu.vn}
      PARKING_MAIL_ALERT_TO: ${PARKING_MAIL_ALERT_TO:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_SMTP_SSL: ${MAIL_SMTP_SSL:-false}
      VIETQR_BANK_ID: ${VIETQR_BANK_ID:-MB}
      VIETQR_ACCOUNT_NO: ${VIETQR_ACCOUNT_NO:-0987654321}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-BAI XE HOC VIEN PTIT}
      VIETQR_TEMPLATE: ${VIETQR_TEMPLATE:-compact2}
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY:-sepay_secret_key_123456}
    volumes:
      - oauthsettings:/app/.parking-secrets
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    container_name: parking-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  mysqldata:
  oauthsettings:
